<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Me perdonas?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffe6e6 0%, #ffb3c1 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 20px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 420px;
      width: 100%;
      position: relative;
    }

    .img-container {
      width: 100%;
      height: 320px;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: all 0.4s ease;
    }

    h1 {
      color: #d63384;
      font-size: 1.6rem;
      margin-bottom: 12px;
    }

    p {
      color: #555;
      font-size: 1rem;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      min-height: 60px;
      position: relative;
    }

    button {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    #btn-si {
      background-color: #28a745;
      color: white;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
      z-index: 10;
    }

    #btn-si:hover {
      background-color: #218838;
    }

    #btn-no {
      background-color: #dc3545;
      color: white;
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
      position: relative;
      transition: all 0.2s ease;
    }

    /* Pantalla final */
    .celebration {
      display: none;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="card" id="main-card">
    <div class="img-container">
      <img id="photo" src="/foto1.jpeg" alt="Nuestra foto">
    </div>
    
    <h1 id="title">¿Me perdonas, mi amor? 🥺💔</h1>
    <p id="message">Prometo cuidar siempre tu sonrisa y hacer las cosas mejor. Te amo con todo mi corazón ❤️</p>

    <div class="btn-group">
      <button id="btn-si">Sí ❤️</button>
      <button id="btn-no">No 💔</button>
    </div>
  </div>

  <script>
    // Rutas de tus fotos ordenadas
    const photos = [
      '/foto1.jpeg', // 120470.png
      '/foto2.jpeg', // 120469.png
      '/foto3.jpeg', // 120468.png
      '/foto4.jpeg'  // 120467.png
    ];

    const finalPhoto = '/foto_final.jpeg'; // 120215.png

    const phrases = [
      "¿Segura? Pensalo bien... 🥺",
      "¡Dale, di que sí! Mira lo felices que somos 🌹",
      "¿De verdad me vas a decir que no? 💔",
      "¡No te va a quedar de otra más que perdonarme! 🙈"
    ];

    let photoIndex = 0;
    let scaleSi = 1;

    const btnSi = document.getElementById('btn-si');
    const btnNo = document.getElementById('btn-no');
    const imgElement = document.getElementById('photo');
    const titleElement = document.getElementById('title');
    const messageElement = document.getElementById('message');

    // Función para mover el botón "NO" de forma escurridiza
    function moverBotonNo() {
      // Cambiar imagen dinámicamente al intentar decir NO
      photoIndex = (photoIndex + 1) % photos.length;
      imgElement.src = photos[photoIndex];

      // Aumentar progresivamente el tamaño del botón SÍ
      scaleSi += 0.25;
      btnSi.style.transform = `scale(${scaleSi})`;

      // Posicionar botón NO en un lugar aleatorio dentro de la pantalla
      const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 40);
      const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 40);

      btnNo.style.position = 'fixed';
      btnNo.style.left = `${Math.max(20, x)}px`;
      btnNo.style.top = `${Math.max(20, y)}px`;

      // Cambiar la frase
      const phraseIndex = Math.min(Math.floor(scaleSi) - 1, phrases.length - 1);
      titleElement.innerText = phrases[phraseIndex];
    }

    // Eventos para móvil (touchstart) y PC (mouseover/click)
    btnNo.addEventListener('mouseover', moverBotonNo);
    btnNo.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moverBotonNo();
    });

    // Acción cuando finalmente presiona SÍ
    btnSi.addEventListener('click', () => {
      imgElement.src = finalPhoto;
      titleElement.innerText = "¡Siiii! ¡Sabía que me perdonarías! 🎉💖";
      messageElement.innerText = "Prometo sacarte siempre la mejor de las sonrisas. ¡Te amo muchísimo!";
      
      // Ocultar botones y reiniciar escala
      btnSi.style.display = 'none';
      btnNo.style.display = 'none';

      // Efecto simple de confeti con emojis
      crearLluviaCorazones();
    });

    function crearLluviaCorazones() {
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.style.position = 'fixed';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.top = '-20px';
        heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
        heart.style.animation = `fall ${Math.random() * 3 + 2}s linear infinite`;
        document.body.appendChild(heart);
      }
    }

    // Agregar estilos CSS para la animación de caída de corazones
    const styleSheet = document.styleSheets[0];
    styleSheet.insertRule(`
      @keyframes fall {
        to {
          transform: translateY(105vh) rotate(360deg);
        }
      }
    `, styleSheet.cssRules.length);
  </script>
</body>
</html>
